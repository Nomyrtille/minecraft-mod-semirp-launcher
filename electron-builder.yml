appId: 'fr.myrtillecity.launcher'
productName: 'Myrtille City'
artifactName: 'MyrtilleCity-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Myrtille City. Based on Helios Launcher, Copyright © 2017-2026 Daniel Scalzi (MIT).'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,tools,pack,.cache}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'MyrtilleCity-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Myrtille City'
  vendor: 'Myrtille City'
  synopsis: 'Launcher du serveur Myrtille City'
  description: 'Launcher du serveur Minecraft semi-RP Myrtille City. Les mods, la configuration et les mises à jour sont gérés automatiquement.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'