name: Build

# - push sur une branche ou lancement à la main : construit les installateurs et les garde
#   7 jours en artefacts du run (pour tester), sans rien publier ;
# - tag vX.Y.Z : construit et publie les installateurs dans la release GitHub du tag, d'où les
#   joueurs les téléchargent (https://myrtillecity.nomyrtille.com/jouer/) et d'où les launchers
#   installés tirent leurs mises à jour.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à package.json (${version})." >&2
            exit 1
          fi

      - name: Build and publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
        shell: bash

      - name: Build only
        if: github.ref_type != 'tag'
        run: npm run dist -- --publish never
        shell: bash

      - name: Keep the installers of this run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/MyrtilleCity*
            dist/latest*.yml
          retention-days: 7
          if-no-files-found: error
