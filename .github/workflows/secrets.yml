name: Secrets

# Dépôt public : aucun secret ne doit y entrer. Gitleaks vérifie chaque push et chaque PR.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lit les commits de la PR.
  pull-requests: read

concurrency:
  # Une seule exécution par PR (la plus récente) ; sur la branche principale, rien n'est jamais annulé.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Licence Gitleaks : secret de l'organisation Nomyrtille (Settings → Secrets and variables → Actions).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
