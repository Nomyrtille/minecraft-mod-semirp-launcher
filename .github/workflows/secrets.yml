name: Secrets

# Dépôt public : aucun secret ne doit y entrer. Gitleaks vérifie chaque push et chaque PR.
on:
  push:
  pull_request:

permissions:
  contents: read
  # gitleaks-action lit les commits de la PR.
  pull-requests: read

jobs:
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Licence Gitleaks : secret de l'organisation Nomyrtille (Settings → Secrets and variables → Actions).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
